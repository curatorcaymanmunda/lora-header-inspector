[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-header-inspector"
version = "0.6.2"
description = "Header-only LoRA architecture inspection and conservative library planning"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Community contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
lora-inspect = "lora_header_inspector.inspection:main"
lora-sort = "lora_header_inspector.cli_sort:main"
lora-smoke = "lora_header_inspector.smoke:main"
lora-fixtures = "lora_header_inspector.fixtures:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
