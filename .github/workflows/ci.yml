name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }} regression and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum even after its upstream end of life.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete regression suite (includes fault injection and recovery)
        run: python test_lora_tools.py
      - name: Explicit crash and recovery gate
        run: python test_lora_tools.py tests.test_fault_injection
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel from sdist, and validate metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install and exercise each distribution outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            env_dir="$(mktemp -d "$RUNNER_TEMP/lora-install.XXXXXX")"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install "$artifact"
            "$env_dir/bin/python" -m pip check
            cd "$RUNNER_TEMP"
            "$env_dir/bin/python" -I "$GITHUB_WORKSPACE/ci/check_installed.py" "$GITHUB_WORKSPACE/tests/fixtures/signatures"
          done
